name: 'Notify Deployment'
description: >
  Emits an "I've just deployed to an environment" event by triggering the
  deployment-event workflow_dispatch in steve-event-handler. Intended to be
  called by project pipelines (e.g. example-project-1) right after a deploy
  step completes.

  Authenticates using a short-lived installation token for the
  "example-eventmanager" GitHub App (minted from app-id/private-key), NOT a
  personal access token or the app's OAuth client secret - a client secret
  can only be used in interactive OAuth flows, it cannot call the Actions
  API. Triggering (rather than calling) deployment-event.yml as a plain
  workflow_dispatch also means steve-event-handler's run executes fully in
  its own repository context, so any secrets it needs stay private to it -
  unlike a `workflow_call` reusable workflow, which never has access to its
  own repo's secrets unless the caller explicitly forwards them.

inputs:
  application:
    description: Name of the application/repo that was deployed
    required: true
  environment:
    description: Environment the application was deployed to (dev/staging/production)
    required: true
  version:
    description: Version/tag of the deployed application
    required: true
  commit-sha:
    description: Commit SHA that was deployed
    required: true
  deployed-by:
    description: Actor who triggered the deployment
    required: false
    default: ${{ github.actor }}
  artifact-name:
    description: Name of the built artifact a build-provenance attestation was generated for
    required: false
    default: ''
  artifact-digest:
    description: sha256:<digest> of the built artifact a build-provenance attestation was generated for
    required: false
    default: ''
  source-repo:
    description: owner/repo of the project that was deployed
    required: false
    default: ${{ github.repository }}
  event-handler-repo:
    description: owner/repo of the event handler to dispatch to
    required: false
    default: steve-sre-event-playground/steve-event-handler
  event-handler-workflow:
    description: Workflow filename (in event-handler-repo) to dispatch
    required: false
    default: deployment-event.yml
  app-id:
    description: App ID of the GitHub App used to authenticate the cross-repo dispatch (SRE_EVENTMANAGER_APP_ID)
    required: true
  app-private-key:
    description: Private key (PEM) of the GitHub App used to authenticate the cross-repo dispatch (SRE_EVENTMANAGER_PRIVATE_KEY)
    required: true

runs:
  using: composite
  steps:
    - name: Determine target repo name
      id: target
      shell: bash
      run: echo "repo-name=${GHR##*/}" >> "$GITHUB_OUTPUT"
      env:
        GHR: ${{ inputs.event-handler-repo }}

    - name: Generate installation token for example-eventmanager app
      id: app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: steve-sre-event-playground
        repositories: ${{ steps.target.outputs.repo-name }}

    - name: Trigger "deployment" event on event handler
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        echo "Dispatching deployment event for ${{ inputs.application }} (${{ inputs.environment }}) to ${{ inputs.event-handler-repo }}"

        gh workflow run "${{ inputs.event-handler-workflow }}" \
          --repo "${{ inputs.event-handler-repo }}" \
          --ref main \
          --field application="${{ inputs.application }}" \
          --field environment="${{ inputs.environment }}" \
          --field version="${{ inputs.version }}" \
          --field commit_sha="${{ inputs.commit-sha }}" \
          --field deployed_by="${{ inputs.deployed-by }}" \
          --field artifact_name="${{ inputs.artifact-name }}" \
          --field artifact_digest="${{ inputs.artifact-digest }}" \
          --field source_repo="${{ inputs.source-repo }}"

        echo "Deployment event dispatched."
